<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="شاشة إشارة صب القهوة">
    <title>Coffee Signal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --idle-color: #334155;
            --active-color: #22c55e;
            --text-color: #f8fafc;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            overflow: hidden;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #number {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: min(60vw, 60vh);
            font-weight: 700;
            line-height: 1;
            color: var(--idle-color);
            transition: color 0.3s ease, transform 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
        }
        #number.active {
            color: var(--active-color);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="number">0</div>

    <script>
        const numberEl = document.getElementById('number');
        let lastValue = null;

        function render(value) {
            if (value === lastValue) return;
            lastValue = value;
            numberEl.textContent = value;
            numberEl.classList.toggle('active', value === 1);
        }

        async function pollStatus() {
            try {
                const res = await fetch('/coffee/status', { cache: 'no-store' });
                if (!res.ok) return;
                const data = await res.json();
                render(data.value);
            } catch (e) {
                /* silent - keep last known value */
            }
        }

        pollStatus();
        setInterval(pollStatus, 500);
    </script>
</body>
</html>
